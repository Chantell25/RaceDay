name: RaceDay Part 2 CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raceday-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Restore, build, and test (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate required project files
        shell: bash
        run: |
          set -euo pipefail
          test -f RaceDay.sln
          test -f RaceDay.Api/RaceDay.Api.csproj
          test -f RaceDay.Tests/RaceDay.Tests.csproj
          test -f docs/RaceDayDB.sql
          test -f README.md
          test -f .github/workflows/dotnet.yml

      - name: Restore solution dependencies
        run: dotnet restore RaceDay.sln

      - name: Build solution (Release)
        run: dotnet build RaceDay.sln --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test RaceDay.sln --configuration Release --no-build --logger "console;verbosity=normal"
